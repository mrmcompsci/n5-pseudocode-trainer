<script>
const QA=[{"id":1,"title":"Powers calculator","difficulty":"Starter","construct":"Sequence","scenario":"Write a program that asks the user to enter a base number and a power. The program should calculate and display the result. For example, if the user enters 3 and 4, the program displays 81.","python":"base = int(input(\"Enter the base number: \"))\npower = int(input(\"Enter the power: \"))\nresult = base ** power\nprint(\"Result: \" + str(result))","pseudo":"get base from user\nget power from user\nset result to base ** power\ndisplay \"Result: \" + result","sqarl":"RECEIVE base FROM KEYBOARD\nRECEIVE power FROM KEYBOARD\nSET result TO base ^ power\nSEND \"Result: \" & result TO DISPLAY","validation":{"pseudo":[{"label":"Get both inputs","need_all":[["get base","base from user"],["get power","power from user","exponent"]],"ok":"Both inputs obtained.","fix":"get base from user\nget power from user"},{"label":"base ** power","must":["base ** power","base**power","base ^ power","base^power"],"ok":"** used for the calculation.","fix":"set result to base ** power"},{"label":"Display result","must":["display","output","print","show"],"ok":"Result displayed.","fix":"display \"Result: \" + result"}],"sqarl":[{"label":"RECEIVE both inputs","need_all":["receive base","receive power"],"ok":"Both RECEIVE lines present.","fix":"RECEIVE base FROM KEYBOARD\nRECEIVE power FROM KEYBOARD"},{"label":"SET result TO base ^ power","must":["set result to base ^ power","set result to base^power"],"ok":"SET result TO base ^ power correct.","fix":"SET result TO base ^ power"},{"label":"SEND with &","need_all":["send","&","to display"],"ok":"SEND & result TO DISPLAY present.","fix":"SEND \"Result: \" & result TO DISPLAY"}],"python":[{"label":"int(input()) for both","need_all":["int(input"],"ok":"int(input()) used.","fix":"base = int(input('Enter the base: '))\npower = int(input('Enter the power: '))"},{"label":"base ** power","must":["base ** power","base**power"],"ok":"** operator correct.","fix":"result = base ** power"},{"label":"print() with +","need_all":["print(","str(result)","+"],"ok":"print() with + and str() correct.","fix":"print(\"Result: \" + str(result))"}]}},{"id":2,"title":"Times table","difficulty":"Starter","construct":"Fixed loop (FOR)","scenario":"Write a program that asks the user which times table they want to see, then displays every result from 1\u00d7 to 12\u00d7.","python":"table = int(input(\"Which times table? \"))\nfor counter in range(1, 13):\n    print(str(counter) + \" x \" + str(table) + \" = \" + str(counter * table))","pseudo":"get table from user\nfor counter from 1 to 12\n    display counter + \" x \" + table + \" = \" + counter * table\nend for","sqarl":"RECEIVE table FROM KEYBOARD\nFOR counter FROM 1 TO 12 DO\n    SEND counter & \" x \" & table & \" = \" & counter * table TO DISPLAY\nEND FOR","validation":{"pseudo":[{"label":"Get table + for counter","need_all":[["get table","table from user"],"for counter"],"ok":"Input and FOR loop present.","fix":"get table from user\nfor counter from 1 to 12"},{"label":"Display with + inside loop","need_all":[["display","output","print"],["counter+","counter *"]],"ok":"Display with + inside loop.","fix":"display counter + \" x \" + table + \" = \" + counter * table"},{"label":"end for","must":["end for","endfor"],"ok":"end for present.","fix":"end for"}],"sqarl":[{"label":"FOR counter FROM 1 TO 12 DO","must":["for counter from 1 to 12"],"ok":"FOR counter FROM 1 TO 12 DO correct.","fix":"FOR counter FROM 1 TO 12 DO"},{"label":"SEND with & inside loop","need_all":["send","&","counter","to display"],"ok":"SEND with & inside loop.","fix":"SEND counter & \" x \" & table & \" = \" & counter * table TO DISPLAY"},{"label":"END FOR","must":["end for"],"ok":"END FOR present.","fix":"END FOR"}],"python":[{"label":"for counter in range(1, 13):","must":["for counter in range(1,13)"],"ok":"for counter in range(1, 13): correct.","fix":"for counter in range(1, 13):"},{"label":"print() with str() and + inside loop","need_all":["print(","str(counter)","+"],"ok":"print() with str() and + inside loop.","fix":"print(str(counter) + \" x \" + str(table) + \" = \" + str(counter * table))"},{"label":"counter * table","must":["counter*table"],"ok":"counter * table used.","fix":"counter * table for the result"}]}},{"id":3,"title":"Bigger number","difficulty":"Starter","construct":"Selection (IF/ELSE IF/ELSE)","scenario":"Write a program that asks the user to enter two numbers. The program should display which number is bigger, or if they are equal.","python":"first = int(input(\"Enter the first number: \"))\nsecond = int(input(\"Enter the second number: \"))\nif first > second:\n    print(\"The first number is bigger\")\nelif first < second:\n    print(\"The second number is bigger\")\nelse:\n    print(\"The numbers are equal\")","pseudo":"get first from user\nget second from user\nif first > second\n    display \"The first number is bigger\"\nelse if first < second\n    display \"The second number is bigger\"\nelse\n    display \"The numbers are equal\"\nend if","sqarl":"RECEIVE first FROM KEYBOARD\nRECEIVE second FROM KEYBOARD\nIF first > second THEN\n    SEND \"The first number is bigger\" TO DISPLAY\nELSE IF first < second THEN\n    SEND \"The second number is bigger\" TO DISPLAY\nELSE\n    SEND \"The numbers are equal\" TO DISPLAY\nEND IF","validation":{"pseudo":[{"label":"Get both inputs","need_all":[["get first","first from user"],["get second","second from user"]],"ok":"Both inputs obtained.","fix":"get first from user\nget second from user"},{"label":"if first > second + else if","need_all":["if first>second",["else if","elseif"]],"ok":"IF and ELSE IF present.","fix":"if first > second\n    ...\nelse if first < second"},{"label":"end if","must":["end if","endif"],"ok":"end if present.","fix":"end if"}],"sqarl":[{"label":"IF first > second THEN","must":["if first>second then","if first>second"],"ok":"IF first > second THEN correct.","fix":"IF first > second THEN"},{"label":"ELSE IF first < second THEN","must":["else if first<second"],"ok":"ELSE IF first < second THEN correct.","fix":"ELSE IF first < second THEN"},{"label":"ELSE + END IF","need_all":["else","end if"],"ok":"ELSE and END IF present.","fix":"ELSE\n    ...\nEND IF"}],"python":[{"label":"if first > second:","must":["if first>second:"],"ok":"if first > second: correct.","fix":"if first > second:"},{"label":"elif first < second:","must":["elif first<second:"],"ok":"elif first < second: correct.","fix":"elif first < second:"},{"label":"else:","must":["else:"],"ok":"else: present.","fix":"else:"}]}},{"id":4,"title":"Grade classifier","difficulty":"Core","construct":"IF/ELSE IF chain","scenario":"Write a program that asks the user to enter a percentage score. Display the grade: A (70 or above), B (60\u201369), C (50\u201359), or Fail (below 50).","python":"score = int(input(\"Enter your score: \"))\nif score >= 70:\n    print(\"A\")\nelif score >= 60:\n    print(\"B\")\nelif score >= 50:\n    print(\"C\")\nelse:\n    print(\"Fail\")","pseudo":"get score from user\nif score >= 70\n    display \"A\"\nelse if score >= 60\n    display \"B\"\nelse if score >= 50\n    display \"C\"\nelse\n    display \"Fail\"\nend if","sqarl":"RECEIVE score FROM KEYBOARD\nIF score >= 70 THEN\n    SEND \"A\" TO DISPLAY\nELSE IF score >= 60 THEN\n    SEND \"B\" TO DISPLAY\nELSE IF score >= 50 THEN\n    SEND \"C\" TO DISPLAY\nELSE\n    SEND \"Fail\" TO DISPLAY\nEND IF","validation":{"pseudo":[{"label":"Get score + check 70","need_all":[["get score","score from user"],"70"],"ok":"Input and 70 boundary present.","fix":"get score from user\nif score >= 70"},{"label":"60 and 50 boundaries","need_all":["60","50"],"ok":"All three boundaries present.","fix":"else if score >= 60\n    ...\nelse if score >= 50"},{"label":"end if","must":["end if","endif"],"ok":"end if present.","fix":"end if"}],"sqarl":[{"label":"IF score >= 70 THEN","must":["if score>=70 then","if score>=70"],"ok":"IF score >= 70 THEN correct.","fix":"IF score >= 70 THEN"},{"label":"ELSE IF for 60 and 50","need_all":["else if score>=60","else if score>=50"],"ok":"ELSE IF for 60 and 50 present.","fix":"ELSE IF score >= 60 THEN\n    ...\nELSE IF score >= 50 THEN"},{"label":"ELSE + END IF","need_all":["else","end if"],"ok":"ELSE (Fail) and END IF present.","fix":"ELSE\n    SEND \"Fail\" TO DISPLAY\nEND IF"}],"python":[{"label":"if score >= 70:","must":["if score>=70:"],"ok":"if score >= 70: correct.","fix":"if score >= 70:"},{"label":"elif for 60 and 50","need_all":["elif score>=60","elif score>=50"],"ok":"elif for 60 and 50 present.","fix":"elif score >= 60:\n    ...\nelif score >= 50:"},{"label":"else:","must":["else:"],"ok":"else: present.","fix":"else:"}]}},{"id":5,"title":"Password checker","difficulty":"Core","construct":"Input validation (WHILE)","scenario":"Write a program that keeps asking the user to enter a password until they type the correct one ('python123'). When they get it right, display 'Access granted'.","python":"password = input(\"Enter password: \")\nwhile password != \"python123\":\n    print(\"Wrong password, try again\")\n    password = input(\"Enter password: \")\nprint(\"Access granted\")","pseudo":"get password from user\nwhile password != \"python123\"\n    display \"Wrong password, try again\"\n    get password from user\nend while\ndisplay \"Access granted\"","sqarl":"RECEIVE password FROM KEYBOARD\nWHILE password \u2260 \"python123\" DO\n    SEND \"Wrong password, try again\" TO DISPLAY\n    RECEIVE password FROM KEYBOARD\nEND WHILE\nSEND \"Access granted\" TO DISPLAY","validation":{"pseudo":[{"label":"Get password + while","need_all":[["get password","password from user"],"while password"],"ok":"Input and WHILE loop present.","fix":"get password from user\nwhile password != \"python123\""},{"label":"Re-read inside loop","must":["get password from user","get password"],"ok":"Password re-read inside loop.","fix":"    get password from user   (inside the loop)"},{"label":"end while + Access granted","need_all":[["end while","endwhile"],["access granted"]],"ok":"end while and Access granted outside loop.","fix":"end while\ndisplay \"Access granted\""}],"sqarl":[{"label":"WHILE password \u2260 ... DO","must":["while password"],"ok":"WHILE password condition present.","fix":"WHILE password \u2260 \"python123\" DO"},{"label":"RECEIVE password inside loop","must":["receive password from keyboard"],"ok":"RECEIVE password FROM KEYBOARD inside loop.","fix":"    RECEIVE password FROM KEYBOARD   (inside the loop)"},{"label":"END WHILE + SEND","need_all":["end while","send \"access","to display"],"ok":"END WHILE and SEND Access granted.","fix":"END WHILE\nSEND \"Access granted\" TO DISPLAY"}],"python":[{"label":"while password != \"python123\":","must":["while password!=\"python123\"","while password!='python123'"],"ok":"while condition correct.","fix":"while password != \"python123\":"},{"label":"password = input() inside loop","must":["password=input("],"ok":"password re-read inside loop.","fix":"    password = input('Enter password: ')   (inside the loop)"},{"label":"print('Access granted') after loop","must":["print(\"access","print('access"],"ok":"Access granted printed after loop.","fix":"print('Access granted')   (outside/after the loop)"}]}},{"id":6,"title":"Running total","difficulty":"Core","construct":"Fixed loop + running total","scenario":"Write a program that asks the user to enter 5 numbers one at a time. At the end, display the total of all 5 numbers.","python":"total = 0\nfor counter in range(5):\n    number = int(input(\"Enter a number: \"))\n    total = total + number\nprint(\"Total: \" + str(total))","pseudo":"set total to 0\nfor counter from 1 to 5\n    get number from user\n    set total to total + number\nend for\ndisplay \"Total: \" + total","sqarl":"SET total TO 0\nFOR counter FROM 1 TO 5 DO\n    RECEIVE number FROM KEYBOARD\n    SET total TO total + number\nEND FOR\nSEND \"Total: \" & total TO DISPLAY","validation":{"pseudo":[{"label":"set total to 0 + for counter","need_all":["set total to 0","for counter"],"ok":"total = 0 and FOR loop present.","fix":"set total to 0\nfor counter from 1 to 5"},{"label":"Get number + set total to total + number","need_all":[["get number","number from user"],"set total to total+number"],"ok":"Input and running total inside loop.","fix":"    get number from user\n    set total to total + number"},{"label":"end for + display total with +","need_all":[["end for","endfor"],"total","+"],"ok":"end for and display total with + present.","fix":"end for\ndisplay \"Total: \" + total"}],"sqarl":[{"label":"SET total TO 0","must":["set total to 0"],"ok":"SET total TO 0 present.","fix":"SET total TO 0"},{"label":"FOR counter FROM 1 TO 5 DO + RECEIVE + SET total","need_all":["for counter from 1 to 5","receive number from keyboard","set total to total+number"],"ok":"FOR loop, RECEIVE and running total correct.","fix":"FOR counter FROM 1 TO 5 DO\n    RECEIVE number FROM KEYBOARD\n    SET total TO total + number"},{"label":"END FOR + SEND with &","need_all":["end for","send","&","total","to display"],"ok":"END FOR and SEND total with & correct.","fix":"END FOR\nSEND \"Total: \" & total TO DISPLAY"}],"python":[{"label":"total = 0","must":["total=0"],"ok":"total = 0 present.","fix":"total = 0"},{"label":"for counter in range(5): + number + total","need_all":[["for counter in range(5)","for counter in range(1,6)"],"number=int(input","total=total+number","total+=number"],"ok":"FOR loop, input and running total correct.","fix":"for counter in range(5):\n    number = int(input('Enter a number: '))\n    total = total + number"},{"label":"print() with str() and + after loop","need_all":["print(","str(total)","+"],"ok":"print() with str() and + correct.","fix":"print(\"Total: \" + str(total))"}]}},{"id":7,"title":"Display all scores","difficulty":"Core","construct":"Array traversal (FOR loop)","scenario":"An array called scores stores 5 pupil test scores: 45, 72, 61, 88, 53. Write a program that displays each score on a new line, e.g. 'Score: 45'.","python":"scores = [45, 72, 61, 88, 53]\nfor counter in range(5):\n    print(\"Score: \" + str(scores[counter]))","pseudo":"set scores to [45, 72, 61, 88, 53]\nfor counter from 0 to 4\n    display \"Score: \" + scores[counter]\nend for","sqarl":"SET scores TO [45, 72, 61, 88, 53]\nFOR counter FROM 0 TO 4 DO\n    SEND \"Score: \" & scores[counter] TO DISPLAY\nEND FOR","validation":{"pseudo":[{"label":"set scores + for counter from 0 to 4","need_all":["set scores to","for counter from 0 to 4"],"ok":"Array and FOR loop correct.","fix":"set scores to [45, 72, 61, 88, 53]\nfor counter from 0 to 4"},{"label":"display scores[counter] with +","need_all":[["display","output","print"],"scores[counter]","+"],"ok":"Display scores[counter] with + inside loop.","fix":"    display \"Score: \" + scores[counter]"},{"label":"end for","must":["end for","endfor"],"ok":"end for present.","fix":"end for"}],"sqarl":[{"label":"SET scores TO [...] + FOR counter FROM 0 TO 4 DO","need_all":["set scores to","for counter from 0 to 4"],"ok":"Array and FOR loop correct.","fix":"SET scores TO [45, 72, 61, 88, 53]\nFOR counter FROM 0 TO 4 DO"},{"label":"SEND scores[counter] with &","need_all":["send","&","scores[counter]","to display"],"ok":"SEND scores[counter] with & correct.","fix":"    SEND \"Score: \" & scores[counter] TO DISPLAY"},{"label":"END FOR","must":["end for"],"ok":"END FOR present.","fix":"END FOR"}],"python":[{"label":"scores = [...] + for counter in range(5):","need_all":["scores=[45","for counter in range(5)"],"ok":"Array and FOR loop correct.","fix":"scores = [45, 72, 61, 88, 53]\nfor counter in range(5):"},{"label":"print() scores[counter] with str() and +","need_all":["print(","scores[counter]",["str(scores[counter])","+ scores"]],"ok":"print() with scores[counter] correct.","fix":"    print(\"Score: \" + str(scores[counter]))"},{"label":"Indented inside loop","must":["scores[counter]"],"ok":"scores[counter] used inside the loop.","fix":"Make sure the print() is indented inside the for loop"}]}},{"id":8,"title":"Rainfall total","difficulty":"Core","construct":"Array + running total in FOR loop","scenario":"An array called rain stores 4 daily rainfall readings in mm: 12, 18, 9, 15. Write a program that calculates and displays the total rainfall.","python":"rain = [12, 18, 9, 15]\ntotal = 0\nfor counter in range(4):\n    total = total + rain[counter]\nprint(\"Total: \" + str(total))","pseudo":"set rain to [12, 18, 9, 15]\nset total to 0\nfor counter from 0 to 3\n    set total to total + rain[counter]\nend for\ndisplay \"Total: \" + total","sqarl":"SET rain TO [12, 18, 9, 15]\nSET total TO 0\nFOR counter FROM 0 TO 3 DO\n    SET total TO total + rain[counter]\nEND FOR\nSEND \"Total: \" & total TO DISPLAY","validation":{"pseudo":[{"label":"set rain + set total to 0 + for counter","need_all":["set rain to","set total to 0","for counter"],"ok":"Array, total and FOR loop present.","fix":"set rain to [12, 18, 9, 15]\nset total to 0\nfor counter from 0 to 3"},{"label":"set total to total + rain[counter]","must":["set total to total+rain[counter]"],"ok":"Running total uses rain[counter].","fix":"    set total to total + rain[counter]"},{"label":"end for + display total with +","need_all":[["end for","endfor"],"total","+"],"ok":"end for and display total with + present.","fix":"end for\ndisplay \"Total: \" + total"}],"sqarl":[{"label":"SET rain + SET total TO 0 + FOR counter FROM 0 TO 3 DO","need_all":["set rain to","set total to 0","for counter from 0 to 3"],"ok":"Array, total and FOR loop correct.","fix":"SET rain TO [12, 18, 9, 15]\nSET total TO 0\nFOR counter FROM 0 TO 3 DO"},{"label":"SET total TO total + rain[counter]","must":["set total to total+rain[counter]"],"ok":"SET total TO total + rain[counter] correct.","fix":"    SET total TO total + rain[counter]"},{"label":"END FOR + SEND with &","need_all":["end for","send","&","total","to display"],"ok":"END FOR function norm(raw){
  return raw.toLowerCase()
    .replace(/end\s+if\b/g,'end if').replace(/end\s+for\b/g,'end for')
    .replace(/end\s+while\b/g,'end while').replace(/else\s+if\b/g,'else if')
    .replace(/\u2260|<>/g,'!=').replace(/\u2265/g,'>=').replace(/\u2264/g,'<=')
    .replace(/\s+/g,' ')
    .replace(/ \(/g,'(').replace(/, /g,',')
    .replace(/ >= /g,'>=').replace(/ <= /g,'<=').replace(/ != /g,'!=')
    .replace(/ = /g,'=').replace(/ \+ /g,'+').replace(/ \* /g,'*').replace(/ \/ /g,'/')
    .replace(/ > /g,'>').replace(/ < /g,'<')
    .trim();
}
function has(t,p){return t.includes(p.toLowerCase());}
function checkCrit(answer,cr){
  const t=norm(answer);
  if(cr.need_all){
    for(const item of cr.need_all){
      if(Array.isArray(item)){if(!item.some(p=>has(t,p)))return{label:cr.label,passed:false,msg:cr.fix,ok:cr.ok};}
      else{if(!has(t,item))return{label:cr.label,passed:false,msg:cr.fix,ok:cr.ok};}
    }
    return{label:cr.label,passed:true,msg:cr.ok,ok:cr.ok};
  }
  if(cr.must){
    const passed=cr.must.some(p=>has(t,p));
    return{label:cr.label,passed,msg:passed?cr.ok:cr.fix,ok:cr.ok};
  }
  return{label:cr.label,passed:true,msg:cr.ok,ok:cr.ok};
}
function validate(answer,criteria){return criteria.map(cr=>checkCrit(answer,cr));}
function verdict(rs){
  const p=rs.filter(r=>r.passed).length;
  if(p===rs.length)return'strong';
  if(p>=rs.length-1)return'mostly';
  return'developing';
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

  <div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">${dots}<span style="font-size:11px;color:#9C9990;font-family:system-ui,sans-serif;margin-left:6px">${c.done.size}/10 strong</span></div>
      <div style="display:flex;gap:6px"><button class="nav" onclick="go(${cur-1})">← Prev</button><button class="nav" onclick="go(${cur+1})">Next →</button></div>
    </div>
    <div class="card">
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px">
        <span style="font-size:16px;font-weight:600">${esc(p.title)}</span>
        <span class="badge" style="background:${d.bg};color:${d.tx}">${p.difficulty}</span>
        <span style="font-size:11px;color:#9C9990;font-family:system-ui,sans-serif;margin-left:auto">Construct: <strong style="color:#6B6963">${esc(p.construct)}</strong></span>
      </div>
      <div class="sub">${c.stimHead}</div>${stim}
      <button class="hint" onclick="th()">${showH?hideH+" ▲":c.hintLabel+" ▼"}</button>
      ${showH?hint:""}
    </div>
    <div class="card">
      <div class="sub">${c.ansHead}</div>
      <textarea id="code" placeholder="${c.ansPh}"></textarea>
      <div style="text-align:right;margin-top:10px"><button class="chk" onclick="chk()" style="background:#D97706">Check my answer →</button></div>
    </div>
    ${fhtml}
  </div>`;
  const ta=document.getElementById("code");
  if(ta){ta.value=saved;ta.addEventListener("input",e=>saved=e.target.value);}
}
function go(i){cur=(i+10)%10;fb=null;showH=false;showM=false;saved='';mtab=CFG[mode].m1f;render();}
function th(){saved=document.getElementById("code")?.value||saved;showH=!showH;render();}
function tm(){showM=!showM;render();}
function st(t){mtab=t;render();}
function chk(){
  const ans=(document.getElementById("code")?.value||saved||"").trim();
  if(!ans)return;
  saved=ans;
  const c=CFG[mode];const p=c.qs[cur];
  const rs=validate(ans,p.validation[c.val]||[]);
  const ov=verdict(rs);
  fb={rs,ov};
  if(ov==="strong")c.done.add(p.id);
  showM=false;render();
}
switchMode('A');
</script>
</body>
