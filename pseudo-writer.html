<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>N5 — Write pseudocode from a scenario</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
body{background:#FAF9F6;font-family:Georgia,serif;padding:20px 16px;color:#1C1C1A}
textarea{font-family:'Courier New',monospace;width:100%;min-height:150px;padding:10px 12px;font-size:13px;line-height:1.7;background:#FAFAF7;border:1.5px solid #D5D2CA;border-radius:8px;resize:vertical;color:#1C1C1A;outline:none;display:block}
textarea:focus{border-color:#D97706;box-shadow:0 0 0 2px rgba(217,119,6,.12)}
pre{background:#1E1B18;color:#F5F0E8;border-radius:8px;padding:12px 14px;font-size:12px;line-height:1.7;white-space:pre-wrap;font-family:'Courier New',monospace;margin:0;overflow-x:auto}
button{cursor:pointer;font-family:system-ui,sans-serif}
.card{background:white;border-radius:12px;padding:18px 22px;margin-bottom:14px;border:1px solid #E8E4DC}
.badge{font-size:11px;padding:2px 9px;border-radius:20px;font-family:system-ui,sans-serif;display:inline-block}
.sub-label{font-size:11px;font-family:system-ui,sans-serif;color:#9C9990;letter-spacing:.07em;font-weight:600;margin-bottom:6px;text-transform:uppercase}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mini-card{background:rgba(255,255,255,.65);border-radius:8px;padding:10px 12px}
.tab-btn{padding:5px 14px;font-size:12px;font-family:system-ui,sans-serif;border:1px solid #C8C4BC;cursor:pointer}
.dot-btn{width:27px;height:27px;border-radius:50%;font-size:10px;font-family:system-ui,sans-serif;cursor:pointer;transition:transform .1s}
.dot-btn:hover{transform:scale(1.12)}
.hint-btn{background:none;border:1px dashed #C8C4BC;border-radius:6px;padding:4px 10px;font-size:11px;color:#6B6963;margin-top:10px}
.hint-btn:hover{background:#F5F0E8}
.nav-btn{background:none;border:1px solid #D5D2CA;border-radius:6px;padding:5px 12px;font-size:12px;color:#6B6963}
.nav-btn:hover{background:#F5F0E8}
.check-btn{color:white;border:none;border-radius:8px;padding:9px 22px;font-size:14px;font-weight:500}
.check-btn:hover{opacity:.88}
.model-toggle{margin-top:12px;background:none;border:1px solid #C8C4BC;border-radius:6px;padding:5px 12px;font-size:11px;color:#6B6963}
.model-toggle:hover{background:rgba(255,255,255,.5)}
.back-link{font-size:12px;font-family:system-ui,sans-serif;color:#9C9990;text-decoration:none;margin-bottom:16px;display:inline-block}
.back-link:hover{color:#3D3D3A}
@media(max-width:520px){.two-col{grid-template-columns:1fr}}</style>
</head>
<body>
<div style="max-width:760px;margin:0 auto">
<a class="back-link" href="index.html">← All modes</a>
<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap">
  <div>
    <h1 style="font-size:20px;font-weight:600">Write pseudocode from a scenario</h1>
    <p style="font-size:12px;color:#9C9990;font-family:system-ui,sans-serif;margin-top:2px">N5 Computing Science &mdash; 12 questions</p>
  </div>
  <span class="badge" style="background:#DBEAFE;color:#1E40AF;margin-left:auto">Scenario → Pseudocode</span>
</div>
<div id="app"></div>

<script>
const QUESTIONS=[{"id": 1, "title": "Powers calculator", "difficulty": "Starter", "construct": "Sequence", "scenario": "Write a program that asks the user to enter a base number and a power. The program should calculate and display the result. For example, if the user enters 3 and 4, the program displays 81.", "python": "base = int(input(\"Enter the base number: \"))\npower = int(input(\"Enter the power: \"))\nresult = base ** power\nprint(\"Result:\", result)", "pseudo": "ask the user to enter the base number and store it in 'base'\nask the user to enter the power and store it in 'power'\nset result to base to the power of power\ndisplay \"Result:\", result", "sqarl": "RECEIVE base FROM KEYBOARD\nRECEIVE power FROM KEYBOARD\nSET result TO base ^ power\nSEND \"Result: \" & result TO DISPLAY", "validation": {"pseudo": [{"label": "Inputs", "check_all": [["base"], ["power", "exponent"]], "wrong": [{"t": ["while", "end while"], "m": "No loop needed here — it's a simple sequence: ask for base, ask for power, calculate, display."}, {"t": ["for each", "for counter", "end for", "repeat"], "m": "No loop needed — just three steps: get the two inputs, calculate, then display."}], "ok": "Both inputs (base and power) are present.", "fix": "Make sure you ask the user for both the base number and the power."}, {"label": "Calculation", "check_any": ["to the power", "power of", "base to", "base ^", "base^", "raised to", "exponent"], "ok": "Calculation step is present.", "fix": "Add a line that calculates base to the power of power, e.g. 'set result to base to the power of power'."}, {"label": "Output", "check_any": ["display", "output", "print", "show", "send"], "ok": "Result is displayed at the end.", "fix": "Don't forget to display the result."}], "sqarl": [{"label": "Input keywords", "check_all": [["receive base", "receive base from"], ["receive power", "receive power from"]], "ok": "Both RECEIVE...FROM KEYBOARD lines are present.", "fix": "Use RECEIVE base FROM KEYBOARD and RECEIVE power FROM KEYBOARD for the two inputs."}, {"label": "Assignment & output", "check_all": [["set result to"], ["send", "to display"]], "ok": "SET and SEND keywords used correctly.", "fix": "Use SET result TO base ^ power for the calculation, and SEND result TO DISPLAY for the output."}, {"label": "Power operator", "check_any": ["base ^ power", "base^power", "^ power", " ^ "], "ok": "Power operator ^ used correctly.", "fix": "In SQARL use ^ for powers: SET result TO base ^ power"}], "python": [{"label": "Input", "check_all": [["input("], ["int("]], "ok": "int(input()) used correctly for numeric input.", "fix": "Use int(input(...)) to read numbers: base = int(input('Enter the base: '))"}, {"label": "Calculation", "check_any": ["** power", "**power", "base **", "base**", " ** "], "ok": "Python power operator ** used correctly.", "fix": "Use ** for powers in Python: result = base ** power"}, {"label": "Output", "check_any": ["print("], "ok": "print() used for output.", "fix": "Use print() to display the result: print('Result:', result)"}]}}, {"id": 2, "title": "Times table", "difficulty": "Starter", "construct": "Fixed loop (FOR)", "scenario": "Write a program that asks the user which times table they want to see, then displays every result from 1× to 12×.", "python": "table = int(input(\"Which times table? \"))\nfor i in range(1, 13):\n    print(i, \"x\", table, \"=\", i * table)", "pseudo": "ask the user which times table they want and store it in 'table'\nfor each number from 1 to 12\n    display the number, \"x\", table, \"=\", the number multiplied by table\nend for", "sqarl": "RECEIVE table FROM KEYBOARD\nFOR counter FROM 1 TO 12 DO\n    SEND counter & \" x \" & table & \" = \" & counter * table TO DISPLAY\nEND FOR", "validation": {"pseudo": [{"label": "Construct", "check_any": ["for each", "for counter", "for number", "repeat 12", "loop from 1 to 12", "for i from", "for loop"], "wrong": [{"t": ["while", "end while"], "m": "A WHILE loop isn't right here — you know exactly how many times to repeat (12). Use a FOR loop instead."}], "ok": "FOR loop correctly chosen.", "fix": "Use a FOR loop here — you repeat a fixed number of times (1 to 12). e.g. 'for each number from 1 to 12'."}, {"label": "Logic", "check_all": [["table"], ["display", "output", "print", "show"], ["multipl", "times", " x ", "*"]], "ok": "Table variable, multiplication and display are all present.", "fix": "Make sure you read in 'table', display each result, and show the multiplication (e.g. number times table)."}, {"label": "Structure", "check_any": ["end for", "endfor", "end loop", "end repeat"], "ok": "Loop is closed with 'end for'.", "fix": "Close your FOR loop with 'end for' at the end of the repeated section."}], "sqarl": [{"label": "FOR loop keywords", "check_all": [["for counter from 1 to 12", "for counter from 1 to 12 do"], ["end for"]], "ok": "FOR...DO...END FOR structure is correct.", "fix": "Use: FOR counter FROM 1 TO 12 DO ... END FOR"}, {"label": "Output inside loop", "check_any": ["send counter", "send", "to display"], "ok": "SEND...TO DISPLAY used for output.", "fix": "Inside the loop use SEND ... TO DISPLAY to show each result."}, {"label": "String concatenation", "check_any": ["counter &", "& counter", "& table", "table &", "& \" x \"", "& \" = \""], "ok": "& used to concatenate values in the output.", "fix": "Use & to join values in SQARL: SEND counter & \" x \" & table & \" = \" & counter * table TO DISPLAY"}], "python": [{"label": "FOR loop", "check_all": [["for "], ["range(1", "range(1,"]], "ok": "for...in range(1,13) used correctly.", "fix": "Use: for i in range(1, 13): — this gives you 1 through 12."}, {"label": "Output inside loop", "check_any": ["print(i", "print(i,"], "ok": "print() called inside the loop.", "fix": "Put print() inside the loop (indented 4 spaces) to show each result."}, {"label": "Multiplication", "check_any": ["i * table", "i*table", "i * t"], "ok": "i * table calculates each result correctly.", "fix": "Calculate each result with i * table inside the loop."}]}}, {"id": 3, "title": "Bigger number", "difficulty": "Starter", "construct": "Selection (IF/ELSE IF/ELSE)", "scenario": "Write a program that asks the user to enter two numbers. The program should display which number is bigger, or if they are equal.", "python": "first = int(input(\"Enter the first number: \"))\nsecond = int(input(\"Enter the second number: \"))\nif first > second:\n    print(\"The first number is bigger\")\nelif first < second:\n    print(\"The second number is bigger\")\nelse:\n    print(\"The numbers are equal\")", "pseudo": "ask the user to enter the first number and store it in 'first'\nask the user to enter the second number and store it in 'second'\nif first is greater than second\n    display \"The first number is bigger\"\nelse if first is less than second\n    display \"The second number is bigger\"\nelse\n    display \"The numbers are equal\"\nend if", "sqarl": "RECEIVE first FROM KEYBOARD\nRECEIVE second FROM KEYBOARD\nIF first > second THEN\n    SEND \"The first number is bigger\" TO DISPLAY\nELSE IF first < second THEN\n    SEND \"The second number is bigger\" TO DISPLAY\nELSE\n    SEND \"The numbers are equal\" TO DISPLAY\nEND IF", "validation": {"pseudo": [{"label": "Construct", "check_any": ["if ", "if first", "if second", "if the"], "wrong": [{"t": ["for each", "for counter", "end for"], "m": "No loop needed here — you just check which number is bigger once, using IF/ELSE IF/ELSE."}, {"t": ["while", "end while"], "m": "No loop needed here — use IF/ELSE IF/ELSE to check which number is bigger."}], "ok": "IF statement correctly chosen.", "fix": "Use an IF/ELSE IF/ELSE structure to compare the two numbers."}, {"label": "Logic", "check_all": [["first", "second"], ["greater than", "bigger than", "larger than", ">"], ["equal", "same", "=="]], "ok": "Both comparison and equality check are present.", "fix": "Check three cases: first > second, first < second, and if they're equal."}, {"label": "Structure", "check_all": [["else if", "elseif"], ["end if", "endif"]], "ok": "ELSE IF and END IF present — structure is complete.", "fix": "You need ELSE IF for the second comparison, and END IF to close the block."}], "sqarl": [{"label": "IF structure", "check_all": [["if first > second then", "if first > second"], ["else if first < second", "else if first <"], ["else"], ["end if"]], "ok": "Full IF/ELSE IF/ELSE/END IF structure present.", "fix": "You need: IF first > second THEN ... ELSE IF first < second THEN ... ELSE ... END IF"}, {"label": "RECEIVE keywords", "check_all": [["receive first"], ["receive second"]], "ok": "Both RECEIVE...FROM KEYBOARD lines present.", "fix": "Read both numbers with RECEIVE first FROM KEYBOARD and RECEIVE second FROM KEYBOARD."}, {"label": "SEND keywords", "check_any": ["send \"the first", "send \"the second", "send \"the numbers"], "ok": "SEND...TO DISPLAY used for all three output messages.", "fix": "Use SEND \"The first number is bigger\" TO DISPLAY (and similar) for each branch."}], "python": [{"label": "Input", "check_all": [["first", "int(input"], ["second", "int(input"]], "ok": "Both inputs read correctly with int(input()).", "fix": "Read both numbers: first = int(input('Enter the first number: '))"}, {"label": "IF/ELIF/ELSE", "check_all": [["if first > second", "if first>second"], ["elif first < second", "elif first<second"], ["else"]], "ok": "if/elif/else structure is correct.", "fix": "Use if, elif (for the second check), and else — not two separate if statements."}, {"label": "Colons", "check_all": [["if first > second:", "if first>second:"], ["elif"], ["else:"]], "ok": "Colons present on all if/elif/else lines.", "fix": "Don't forget the colon at the end of if, elif and else lines."}]}}, {"id": 4, "title": "Grade classifier", "difficulty": "Core", "construct": "IF/ELSE IF chain", "scenario": "Write a program that asks the user to enter a percentage score. Display the grade: A (70 or above), B (60–69), C (50–59), or Fail (below 50).", "python": "score = int(input(\"Enter your score: \"))\nif score >= 70:\n    print(\"A\")\nelif score >= 60:\n    print(\"B\")\nelif score >= 50:\n    print(\"C\")\nelse:\n    print(\"Fail\")", "pseudo": "ask the user to enter their score and store it in 'score'\nif score is greater than or equal to 70\n    display \"A\"\nelse if score is greater than or equal to 60\n    display \"B\"\nelse if score is greater than or equal to 50\n    display \"C\"\nelse\n    display \"Fail\"\nend if", "sqarl": "RECEIVE score FROM KEYBOARD\nIF score >= 70 THEN\n    SEND \"A\" TO DISPLAY\nELSE IF score >= 60 THEN\n    SEND \"B\" TO DISPLAY\nELSE IF score >= 50 THEN\n    SEND \"C\" TO DISPLAY\nELSE\n    SEND \"Fail\" TO DISPLAY\nEND IF", "validation": {"pseudo": [{"label": "Construct", "check_any": ["if score", "if the score", "if score >=", "if score is"], "wrong": [{"t": ["for each", "for counter", "end for"], "m": "No loop needed — use an IF/ELSE IF chain to check the score once."}, {"t": ["while", "end while"], "m": "No loop needed — use IF/ELSE IF/ELSE to classify the grade."}], "ok": "IF/ELSE IF chain correctly chosen.", "fix": "Use an IF/ELSE IF/ELSE chain to check each grade boundary."}, {"label": "Boundaries", "check_all": [["70"], ["60"], ["50"]], "ok": "All three grade boundaries (70, 60, 50) are present.", "fix": "You need to check all three boundaries: 70 for A, 60 for B, 50 for C."}, {"label": "Structure", "check_all": [["else if", "elseif"], ["else"], ["end if", "endif"]], "ok": "ELSE IF, ELSE and END IF all present.", "fix": "You need multiple ELSE IF lines (one for each boundary) plus ELSE and END IF at the end."}], "sqarl": [{"label": "Boundaries in SQARL", "check_all": [["if score >= 70 then", "if score>=70"], ["else if score >= 60", "else if score>=60"], ["else if score >= 50", "else if score>=50"], ["else"]], "ok": "All four branches (A/B/C/Fail) present with correct boundaries.", "fix": "You need four branches: IF score >= 70 THEN ... ELSE IF score >= 60 THEN ... ELSE IF score >= 50 THEN ... ELSE ..."}, {"label": "END IF", "check_any": ["end if"], "ok": "END IF closes the structure correctly.", "fix": "Close the entire IF block with END IF at the very end."}, {"label": "RECEIVE & SEND", "check_all": [["receive score"], ["send", "to display"]], "ok": "RECEIVE and SEND keywords used correctly.", "fix": "Use RECEIVE score FROM KEYBOARD for input and SEND grade TO DISPLAY for output."}], "python": [{"label": "IF/ELIF chain", "check_all": [["if score >= 70", "if score>=70"], ["elif score >= 60", "elif score>=60"], ["elif score >= 50", "elif score>=50"], ["else"]], "ok": "if/elif/elif/else chain with correct boundaries.", "fix": "Use elif (not separate if statements) for each boundary: elif score >= 60:"}, {"label": "Colons", "check_all": [["if score >= 70:", "if score>=70:"], ["elif"], ["else:"]], "ok": "Colons present on all branches.", "fix": "Don't forget the colon at the end of if, elif and else lines."}, {"label": "Output", "check_any": ["print(\"a\")", "print('a')", "print(\"b\")", "print('b')", "print(\"fail\")", "print('fail')"], "ok": "print() used to display the grade.", "fix": "Use print() to display the grade letter in each branch."}]}}, {"id": 5, "title": "Password checker", "difficulty": "Core", "construct": "Conditional loop (WHILE)", "scenario": "Write a program that keeps asking the user to enter a password until they type the correct one ('python123'). When they get it right, display 'Access granted'.", "python": "password = input(\"Enter password: \")\nwhile password != \"python123\":\n    print(\"Wrong password, try again\")\n    password = input(\"Enter password: \")\nprint(\"Access granted\")", "pseudo": "ask the user to enter the password and store it in 'password'\nwhile the password is not 'python123'\n    display \"Wrong password, try again\"\n    ask the user to enter the password again\nend while\ndisplay \"Access granted\"", "sqarl": "RECEIVE password FROM KEYBOARD\nWHILE password ≠ \"python123\" DO\n    SEND \"Wrong password, try again\" TO DISPLAY\n    RECEIVE password FROM KEYBOARD\nEND WHILE\nSEND \"Access granted\" TO DISPLAY", "validation": {"pseudo": [{"label": "Construct", "check_any": ["while", "until"], "wrong": [{"t": ["for each", "for counter", "end for", "repeat 5", "repeat 3", "repeat 10"], "m": "A FOR loop repeats a fixed number of times — but here you don't know how many attempts they'll need. Use a WHILE loop instead."}], "ok": "WHILE loop correctly chosen.", "fix": "Use a WHILE loop — you don't know how many attempts the user will need."}, {"label": "Logic", "check_all": [["password"], ["not", "!=", "≠", "wrong", "incorrect"], ["again", "re-enter", "enter again", "ask again", "ask the user to enter the password again"]], "ok": "Condition, error message, and re-reading input inside the loop are all present.", "fix": "Inside the WHILE loop you need: display an error message, then ask for the password again."}, {"label": "Structure", "check_all": [["end while", "endwhile"], ["access granted", "correct", "logged in", "welcome"]], "ok": "END WHILE present and success message displayed after the loop.", "fix": "Close the loop with 'end while', then display 'Access granted' AFTER the loop (not inside it)."}], "sqarl": [{"label": "WHILE structure", "check_all": [["while password", "while password ≠", "while password !="], ["do"], ["end while"]], "ok": "WHILE...DO...END WHILE structure is correct.", "fix": "Use: WHILE password ≠ \"python123\" DO ... END WHILE"}, {"label": "Re-read inside loop", "check_any": ["receive password from keyboard"], "ok": "Password is re-read inside the loop.", "fix": "Inside the WHILE loop, you must read the password again: RECEIVE password FROM KEYBOARD"}, {"label": "Success message after loop", "check_any": ["send \"access granted", "send \"access"], "ok": "Success message sent after the loop ends.", "fix": "SEND \"Access granted\" TO DISPLAY must come AFTER END WHILE, not inside the loop."}], "python": [{"label": "WHILE loop", "check_all": [["while password != \"python123\"", "while password!=\"python123\"", "while password != 'python123'"], ["while password"]], "ok": "WHILE loop with correct condition.", "fix": "Use: while password != \"python123\": — check the condition at the start of each loop."}, {"label": "Re-read inside loop", "check_any": ["password = input("], "ok": "Password re-read inside the loop with input().", "fix": "Inside the while loop, read the password again: password = input('Enter password: ')"}, {"label": "Success after loop", "check_any": ["print(\"access", "print('access", "print(\"Access", "print('Access"], "ok": "Success message printed after the loop.", "fix": "print('Access granted') must be outside and after the while loop (same indentation level as 'while')."}]}}, {"id": 6, "title": "Running total", "difficulty": "Core", "construct": "Fixed loop + running total", "scenario": "Write a program that asks the user to enter 5 numbers one at a time. At the end, display the total of all 5 numbers.", "python": "total = 0\nfor i in range(5):\n    number = int(input(\"Enter a number: \"))\n    total = total + number\nprint(\"Total:\", total)", "pseudo": "set total to 0\nfor each number from 1 to 5\n    ask the user to enter a number and store it in 'number'\n    add number to total\nend for\ndisplay \"Total:\", total", "sqarl": "SET total TO 0\nFOR counter FROM 1 TO 5 DO\n    RECEIVE number FROM KEYBOARD\n    SET total TO total + number\nEND FOR\nSEND \"Total: \" & total TO DISPLAY", "validation": {"pseudo": [{"label": "Construct", "check_any": ["for each", "for counter", "repeat 5", "loop 5", "for i from", "for number"], "wrong": [{"t": ["while", "end while"], "m": "A WHILE loop isn't right here — you know exactly how many numbers to add (5). Use a FOR loop."}], "ok": "FOR loop correctly chosen for exactly 5 repetitions.", "fix": "Use a FOR loop — you're collecting exactly 5 numbers."}, {"label": "Logic", "check_all": [["total", "set total to 0", "     .replace(/end\s+while\b/g,'endwhile').replace(/else\s+if\b/g,'elseif')
    .replace(/\u2260|!=|<>/g,'!=').replace(/\u2265|>=/g,'>=').replace(/\u2264|<=/g,'<=')
    
    .replace(/\s+/g,' ').trim();
}
function hasAny(t,arr){ return arr.some(p=>t.includes(p.toLowerCase())); }
function hasAll(t,groups){ return groups.every(g=>Array.isArray(g)?hasAny(t,g):t.includes(g.toLowerCase())); }

function runCriteria(answer, criteria) {
  const n = normText(answer);
  return criteria.map(cr => {
    // wrong construct check first
    if (cr.wrong) {
      for (const w of cr.wrong) {
        if (hasAny(n, w.t)) return {label:cr.label, passed:false, icon:'wrong', msg:w.m, ok:cr.ok};
      }
    }
    let passed = false;
    if (cr.check_any) passed = hasAny(n, cr.check_any);
    else if (cr.check_all) passed = hasAll(n, cr.check_all);
    else passed = true;
    return {label:cr.label, passed, icon: passed?'tick':'cross',
            msg: passed ? cr.ok : cr.fix, ok: cr.ok};
  });
}

function getVerdict(results) {
  const p = results.filter(r=>r.passed).length;
  const t = results.length;
  if (p===t) return 'strong';
  if (p===t-1) return 'mostly';
  return 'developing';
}

let cur=0,fb=null,showHint=false,showModel=false,modelTab="pseudo",saved="";
const done=new Set();
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function render(){
  const p=QUESTIONS[cur];
  const d=DIFF[p.difficulty]||{};
  const vs=VERDICT[fb?.overall]||{};

  const stimHtml=`<p style="color:#3D3D3A;line-height:1.65;font-size:14px">${esc(p.scenario)}</p>`;
  const hintHtml=`<pre style="margin-top:10px" >${esc(p.python)}</pre>`;

  const dots=QUESTIONS.map((q,i)=>`<button class="dot-btn" onclick="go(${i})" style="border:2px solid ${i===cur?"#D97706":"#D5D2CA"};background:${done.has(q.id)?"#D97706":i===cur?"white":"transparent"};color:${done.has(q.id)?"white":"#6B6963"};font-weight:${i===cur?600:400}">${i+1}</button>`).join("");

  let fbHtml="";
  if(fb){
    const rows=fb.results.map(r=>{
      const ic=r.passed?"✓":r.icon==="wrong"?"✗":"✗";
      const col=r.passed?"#059669":"#DC2626";
      return `<div style="display:flex;gap:10px;margin-bottom:10px;align-items:flex-start">
        <span style="color:${col};min-width:16px;font-size:15px;font-family:system-ui,sans-serif;flex-shrink:0">${ic}</span>
        <div style="font-size:14px;color:#3D3D3A;line-height:1.55"><strong style="font-family:system-ui,sans-serif;font-size:13px">${esc(r.label)}:</strong> ${esc(r.msg)}</div>
      </div>`;
    }).join("");

    const praise=fb.results.find(r=>r.passed);
    const fix=fb.results.find(r=>!r.passed);

    const modelBlock=showModel?`
    <div style="margin-top:12px">
      <div style="display:flex">
        <button class="tab-btn" onclick="setTab('pseudo')" style="border-radius:6px 0 0 0;background:${modelTab==="pseudo"?"#1E1B18":"rgba(255,255,255,.5)"};color:${modelTab==="pseudo"?"#F5F0E8":"#6B6963"};border-bottom:${modelTab==="pseudo"?"none":"1px solid #C8C4BC"}">Pseudocode</button>
        <button class="tab-btn" onclick="setTab('sqarl')" style="border-radius:0 6px 0 0;background:${modelTab==="sqarl"?"#1E1B18":"rgba(255,255,255,.5)"};color:${modelTab==="sqarl"?"#F5F0E8":"#6B6963"};border-bottom:${modelTab==="sqarl"?"none":"1px solid #C8C4BC"}">SQARL</button>
      </div>
      <pre style="border-radius:${modelTab==="pseudo"?"0 6px 6px 6px":"6px 0 6px 6px"}">${esc(p[modelTab])}</pre>
      <p style="font-size:12px;color:#6B6963;font-family:system-ui,sans-serif;margin-top:8px">Compare your pseudocode, then switch to SQARL to see the exam-standard version. Same logic — different keywords.</p>
    </div>`:""

    fbHtml=`<div style="background:${vs.bg};border-radius:12px;padding:18px 22px;margin-bottom:14px;border:1px solid ${vs.border}">
      <div style="font-size:15px;font-weight:600;color:${vs.head};margin-bottom:14px;font-family:system-ui,sans-serif">${vs.label}</div>
      ${rows}
      <div class="two-col">
        <div class="mini-card"><div class="sub-label">Well done</div><div style="font-size:13px;color:#1C1C1A;line-height:1.5">✓ ${esc(praise?.ok||"You’ve made a start.")}</div></div>
        <div class="mini-card"><div class="sub-label">One thing to fix</div><div style="font-size:13px;color:#1C1C1A;line-height:1.5">→ ${esc(fix?.msg||"Refine and check your answer.")}</div></div>
      </div>
      <button class="model-toggle" onclick="toggleModel()">${showModel?"Hide model answer ▲":"See model answer ▼"}</button>
      ${modelBlock}
    </div>`;
  }

  document.getElementById("app").innerHTML=`
  <div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">${dots}
        <span style="font-size:11px;color:#9C9990;font-family:system-ui,sans-serif;margin-left:6px">${done.size}/12 strong</span>
      </div>
      <div style="display:flex;gap:6px">
        <button class="nav-btn" onclick="go(${cur-1})">← Prev</button>
        <button class="nav-btn" onclick="go(${cur+1})">Next →</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px">
        <span style="font-size:16px;font-weight:600">${esc(p.title)}</span>
        <span class="badge" style="background:${d.bg};color:${d.tx}">${p.difficulty}</span>
        <span style="font-size:11px;color:#9C9990;font-family:system-ui,sans-serif;margin-left:auto">Construct: <strong style="color:#6B6963">${esc(p.construct)}</strong></span>
      </div>
      <div class="sub-label">Scenario</div>
      ${stimHtml}
      <button class="hint-btn" onclick="toggleHint()">${showHint?"Hide Python hint ▲":"Show Python hint ▼"}</button>
      ${showHint?hintHtml:""}
    </div>

    <div class="card">
      <div class="sub-label">Your pseudocode</div>
      <textarea id="code" placeholder="Plain English, one line per Python line. Indent inside loops and if/else."></textarea>
      <div style="text-align:right;margin-top:10px">
        <button class="check-btn" onclick="doCheck()" style="background:#D97706">Check my answer →</button>
      </div>
    </div>

    ${fbHtml}
  </div>`;

  const ta=document.getElementById("code");
  if(ta){ta.value=saved;ta.addEventListener("input",e=>saved=e.target.value);}
}

function go(i){cur=(i+12)%12;fb=null;showHint=false;showModel=false;modelTab="pseudo";saved="";render();}
function toggleHint(){saved=document.getElementById("code")?.value||saved;showHint=!showHint;render();}
function toggleModel(){showModel=!showModel;render();}
function setTab(t){modelTab=t;render();}

function doCheck(){
  const answer=(document.getElementById("code")?.value||saved||"").trim();
  if(!answer) return;
  saved=answer;
  const p=QUESTIONS[cur];
  const criteria=p.validation["pseudo"]||[];
  const results=runCriteria(answer,criteria);
  const overall=getVerdict(results);
  fb={results,overall};
  if(overall==="strong") done.add(p.id);
  showModel=false;
  render();
}

render();
</script>
</body>
