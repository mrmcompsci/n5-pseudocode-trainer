<style>*{box-sizing:border-box;margin:0;padding:0}

<script>
const QS=[{"id": 1, "title": "Powers calculator", "difficulty": "Starter", "construct": "Sequence", "scenario": "Write a program that asks the user to enter a base number and a power. The program should calculate and display the result. For example, if the user enters 3 and 4, the program displays 81.", "python": "base = int(input(\"Enter the base number: \"))\npower = int(input(\"Enter the power: \"))\nresult = base ** power\nprint(\"Result:\", result)", "pseudo": "ask the user to enter the base number and store it in 'base'\nask the user to enter the power and store it in 'power'\nset result to base to the power of power\ndisplay \"Result:\", result", "sqarl": "RECEIVE base FROM KEYBOARD\nRECEIVE power FROM KEYBOARD\nSET result TO base ^ power\nSEND \"Result: \" & result TO DISPLAY", "validation": {"pseudo": [{"label": "Inputs", "must": ["base", "power", "exponent"], "need_all": ["base", ["power", "exponent"]], "ok": "Both base and power are asked for.", "fix": "Make sure you ask for both the base number AND the power."}, {"label": "Calculation", "must": ["power of", "to the power", "exponent", "base ^", "base^", "raised to"], "ok": "Calculation step is present.", "fix": "Add a line to calculate the result, e.g. 'set result to base to the power of power'."}, {"label": "Output", "must": ["display", "output", "print", "show"], "ok": "Result is displayed.", "fix": "Don't forget to display the result at the end."}], "sqarl": [{"label": "RECEIVE inputs", "must": ["receive base", "receive power"], "need_all": ["receive base", "receive power"], "ok": "Both RECEIVE...FROM KEYBOARD lines present.", "fix": "Use RECEIVE base FROM KEYBOARD and RECEIVE power FROM KEYBOARD."}, {"label": "SET result", "must": ["set result to base ^ power", "set result to base^power", "set result to base ^ power"], "ok": "SET result TO base ^ power is correct.", "fix": "Calculate with: SET result TO base ^ power   (use ^ for powers in SQARL)"}, {"label": "SEND output", "must": ["send", "to display"], "need_all": ["send", "to display"], "ok": "SEND...TO DISPLAY used for output.", "fix": "Display the result with: SEND \"Result: \" & result TO DISPLAY"}], "python": [{"label": "Input", "must": ["int(input"], "need_all": ["int(input"], "ok": "int(input()) used correctly.", "fix": "Read numbers with int(input(...)): base = int(input('Enter the base: '))"}, {"label": "Power operator", "must": ["base ** power", "base**power", "** power", "**power"], "ok": "** operator used correctly.", "fix": "Use ** for powers in Python: result = base ** power"}, {"label": "print()", "must": ["print("], "ok": "print() used for output.", "fix": "Display the result with print('Result:', result)"}]}}, {"id": 2, "title": "Times table", "difficulty": "Starter", "construct": "Fixed loop (FOR)", "scenario": "Write a program that asks the user which times table they want to see, then displays every result from 1× to 12×.", "python": "table = int(input(\"Which times table? \"))\nfor counter in range(1, 13):\n    print(counter, \"x\", table, \"=\", counter * table)", "pseudo": "ask the user which times table they want and store it in 'table'\nfor counter from 1 to 12\n    display counter, \"x\", table, \"=\", counter multiplied by table\nend for", "sqarl": "RECEIVE table FROM KEYBOARD\nFOR counter FROM 1 TO 12 DO\n    SEND counter & \" x \" & table & \" = \" & counter * table TO DISPLAY\nEND FOR", "validation": {"pseudo": [{"label": "FOR loop", "must": ["for counter", "for each", "repeat 12", "loop from 1 to 12"], "ok": "FOR loop correctly chosen.", "fix": "Use a FOR loop — you repeat a fixed number of times (1 to 12): 'for counter from 1 to 12'"}, {"label": "Multiply & display", "must": ["display", "output", "print", "show"], "need_all": [["display", "output", "print", "show"], ["multipl", "times", "x", "*"]], "ok": "Display and multiplication both present.", "fix": "Inside the loop, display each result: e.g. display counter, 'x', table, '=', counter * table"}, {"label": "END FOR", "must": ["end for", "endfor", "end loop", "end repeat"], "ok": "Loop closed with 'end for'.", "fix": "Close the loop with 'end for'."}], "sqarl": [{"label": "FOR...DO", "must": ["for counter from 1 to 12"], "ok": "FOR counter FROM 1 TO 12 DO is correct.", "fix": "Use: FOR counter FROM 1 TO 12 DO"}, {"label": "SEND inside loop", "must": ["send counter", "send", "to display"], "need_all": ["send", "to display"], "ok": "SEND...TO DISPLAY inside the loop.", "fix": "Inside the loop: SEND counter & \" x \" & table & \" = \" & counter * table TO DISPLAY"}, {"label": "END FOR", "must": ["end for"], "ok": "END FOR closes the loop.", "fix": "Close the loop with END FOR."}], "python": [{"label": "for counter in range", "must": ["for counter in range(1, 13)", "for counter in range(1,13)", "for counter in range(13)"], "ok": "for counter in range(1, 13) is correct.", "fix": "Use: for counter in range(1, 13):  — this gives counter values 1 through 12."}, {"label": "Multiply inside loop", "must": ["counter * table", "counter*table"], "ok": "counter * table calculates each result.", "fix": "Inside the loop: print(counter, 'x', table, '=', counter * table)"}, {"label": "print() inside loop", "must": ["print(counter", "print(counter,"], "ok": "print() called with counter inside the loop.", "fix": "Make sure print() is indented inside the for loop."}]}}, {"id": 3, "title": "Bigger number", "difficulty": "Starter", "construct": "Selection (IF/ELSE IF/ELSE)", "scenario": "Write a program that asks the user to enter two numbers. The program should display which number is bigger, or if they are equal.", "python": "first = int(input(\"Enter the first number: \"))\nsecond = int(input(\"Enter the second number: \"))\nif first > second:\n    print(\"The first number is bigger\")\nelif first < second:\n    print(\"The second number is bigger\")\nelse:\n    print(\"The numbers are equal\")", "pseudo": "ask the user to enter the first number and store it in 'first'\nask the user to enter the second number and store it in 'second'\nif first is greater than second\n    display \"The first number is bigger\"\nelse if first is less than second\n    display \"The second number is bigger\"\nelse\n    display \"The numbers are equal\"\nend if", "sqarl": "RECEIVE first FROM KEYBOARD\nRECEIVE second FROM KEYBOARD\nIF first > second THEN\n    SEND \"The first number is bigger\" TO DISPLAY\nELSE IF first < second THEN\n    SEND \"The second number is bigger\" TO DISPLAY\nELSE\n    SEND \"The numbers are equal\" TO DISPLAY\nEND IF", "validation": {"pseudo": [{"label": "IF construct", "must": ["if first", "if second", "if the first", "if the second"], "ok": "IF statement chosen correctly.", "fix": "Use IF to compare the numbers: 'if first is greater than second'"}, {"label": "ELSE IF", "must": ["else if", "elseif"], "ok": "ELSE IF handles the second comparison.", "fix": "You need ELSE IF for the second comparison (first < second)."}, {"label": "END IF", "must": ["end if", "endif"], "ok": "END IF closes the block.", "fix": "Close the IF block with 'end if'."}], "sqarl": [{"label": "IF first > second THEN", "must": ["if first > second then", "if first > second"], "ok": "IF first > second THEN is correct.", "fix": "Start with: IF first > second THEN"}, {"label": "ELSE IF first < second", "must": ["else if first < second"], "ok": "ELSE IF first < second THEN handles the second case.", "fix": "Add: ELSE IF first < second THEN"}, {"label": "ELSE and END IF", "must": ["else"], "need_all": ["else", "end if"], "ok": "ELSE and END IF both present.", "fix": "You need ELSE for the equal case and END IF to close the block."}], "python": [{"label": "if first > second:", "must": ["if first > second:", "if first>second:"], "ok": "if first > second: is correct.", "fix": "Use: if first > second:"}, {"label": "elif first < second:", "must": ["elif first < second:", "elif first<second:"], "ok": "elif first < second: is correct.", "fix": "Use elif (not a second if): elif first < second:"}, {"label": "else:", "must": ["else:"], "ok": "else: handles the equal case.", "fix": "Add else: to handle when the numbers are equal."}]}}, {"id": 4, "title": "Grade classifier", "difficulty": "Core", "construct": "IF/ELSE IF chain", "scenario": "Write a program that asks the user to enter a percentage score. Display the grade: A (70 or above), B (60–69), C (50–59), or Fail (below 50).", "python": "score = int(input(\"Enter your score: \"))\nif score >= 70:\n    print(\"A\")\nelif score >= 60:\n    print(\"B\")\nelif score >= 50:\n    print(\"C\")\nelse:\n    print(\"Fail\")", "pseudo": "ask the user to enter their score and store it in 'score'\nif score is greater than or equal to 70\n    display \"A\"\nelse if score is greater than or equal to 60\n    display \"B\"\nelse if score is greater than or equal to 50\n    display \"C\"\nelse\n    display \"Fail\"\nend if", "sqarl": "RECEIVE score FROM KEYBOARD\nIF score >= 70 THEN\n    SEND \"A\" TO DISPLAY\nELSE IF score >= 60 THEN\n    SEND \"B\" TO DISPLAY\nELSE IF score >= 50 THEN\n    SEND \"C\" TO DISPLAY\nELSE\n    SEND \"Fail\" TO DISPLAY\nEND IF", "validation": {"pseudo": [{"label": "IF score >= 70", "must": ["if score is greater than or equal to 70", "if score >= 70", "if score>=70", "70"], "ok": "70 boundary checked first.", "fix": "Check the highest boundary first: 'if score is greater than or equal to 70'"}, {"label": "All 3 boundaries", "must": ["60", "50"], "need_all": ["60", "50"], "ok": "All three boundaries (70, 60, 50) present.", "fix": "You need to check all three boundaries: 70 (A), 60 (B), 50 (C)."}, {"label": "END IF", "must": ["end if", "endif"], "ok": "END IF closes the block.", "fix": "Close the block with 'end if'."}], "sqarl": [{"label": "IF score >= 70 THEN", "must": ["if score >= 70 then", "if score>=70"], "ok": "IF score >= 70 THEN is correct.", "fix": "Start with: IF score >= 70 THEN"}, {"label": "ELSE IF boundaries", "must": ["else if score >= 60", "else if score>=60"], "need_all": ["else if score >= 60", "else if score >= 50"], "ok": "ELSE IF branches for 60 and 50 present.", "fix": "Add: ELSE IF score >= 60 THEN and ELSE IF score >= 50 THEN"}, {"label": "ELSE and END IF", "must": ["else"], "need_all": ["else", "end if"], "ok": "ELSE (Fail) and END IF present.", "fix": "Add ELSE for the Fail case and END IF to close."}], "python": [{"label": "if score >= 70:", "must": ["if score >= 70:", "if score>=70:"], "ok": "if score >= 70: is correct.", "fix": "Use: if score >= 70:"}, {"label": "elif boundaries", "must": ["elif score >= 60", "elif score>=60"], "need_all": ["elif score >= 60", "elif score >= 50"], "ok": "elif for 60 and 50 present.", "fix": "Use elif (not if) for the other boundaries: elif score >= 60: and elif score >= 50:"}, {"label": "else:", "must": ["else:"], "ok": "else: handles the Fail case.", "fix": "Add else: for the Fail grade."}]}}, {"id": 5, "title": "Password checker", "difficulty": "Core", "construct": "Conditional loop (WHILE)", "scenario": "Write a program that keeps asking the user to enter a password until they type the correct one ('python123'). When they get it right, display 'Access granted'.", "python": "password = input(\"Enter password: \")\nwhile password != \"python123\":\n    print(\"Wrong password, try again\")\n    password = input(\"Enter password: \")\nprint(\"Access granted\")", "pseudo": "ask the user to enter the password and store it in 'password'\nwhile the password is not 'python123'\n    display \"Wrong password, try again\"\n    ask the user to enter the password again\nend while\ndisplay \"Access granted\"", "sqarl": "RECEIVE password FROM KEYBOARD\nWHILE password ≠ \"python123\" DO\n    SEND \"Wrong password, try again\" TO DISPLAY\n    RECEIVE password FROM KEYBOARD\nEND WHILE\nSEND \"Access granted\" TO DISPLAY", "validation": {"pseudo": [{"label": "WHILE loop", "must": ["while", "until"], "ok": "WHILE loop correctly chosen.", "fix": "Use a WHILE loop — you don't know how many attempts the user needs."}, {"label": "Re-read inside loop", "must": ["ask the user to enter the password again", "ask again", "enter the password again", "re-enter", "enter password again"], "ok": "Password re-read inside the loop.", "fix": "Inside the WHILE loop, ask for the password again so the condition can be re-checked."}, {"label": "END WHILE + success", "must": ["end while", "endwhile"], "need_all": ["end while", "access granted", "access"], "ok": "END WHILE present and 'Access granted' displayed after the loop.", "fix": "Close with 'end while', then display 'Access granted' OUTSIDE the loop."}], "sqarl": [{"label": "WHILE...DO", "must": ["while password"], "ok": "WHILE password condition present.", "fix": "Use: WHILE password ≠ \"python123\" DO"}, {"label": "RECEIVE inside loop", "must": ["receive password from keyboard"], "ok": "RECEIVE password FROM KEYBOARD inside the loop.", "fix": "Inside the loop you must re-read: RECEIVE password FROM KEYBOARD"}, {"label": "END WHILE", "must": ["end while"], "ok": "END WHILE closes the loop.", "fix": "Close the loop with END WHILE, then SEND \"Access granted\" TO DISPLAY after it."}], "python": [{"label": "while password !=", "must": ["while password != \"python123\"", "while password != 'python123'", "while password!=\"python123\"", "while password!='python123'"], "ok": "while password != \"python123\": is correct.", "fix": "Use: while password != \"python123\":"}, {"label": "password = input() inside loop", "must": ["password = input(", "password=input("], "ok": "password re-read inside the loop with input().", "fix": "Inside the while loop: password = input('Enter password: ')"}, {"label": "print() after loop", "must": ["print(\"access", "print('access", "print(\"Access", "print('Access"], "ok": "Access granted printed after the loop.", "fix": "print('Access granted') must be OUTSIDE the while loop (no indent)."}]}}, {"id": 6, "title": "Running total", "difficulty": "Core", "construct": "Fixed loop + running total", "scenario": "Write a program that asks the user to enter 5 numbers one at a time. At the end, display the total of all 5 numbers.", "python": "total = 0\nfor counter in range(5):\n    number = int(input(\"Enter a number: \"))\n    total = total + number\nprint(\"Total:\", total)", "pseudo": "set total to 0\nfor counter from 1 to 5\n    ask the user to enter a number and store it in 'number'\n    add number to total\nend for\ndisplay \"Total:\", total", "sqarl": "SET total TO 0\nFOR counter FROM 1 TO 5 DO\n    RECEIVE number FROM KEYBOARD\n    SET total TO total + number\nEND FOR\nSEND \"Total: \" & total TO DISPLAY", "validation": {"pseudo": [{"label": "FOR loop", "must": ["for counter", "for each", "repeat 5"], "ok": "FOR loop correctly chosen.", "fix": "Use a FOR loop — you collect exactly 5 numbers: 'for counter from 1 to 5'"}, {"label": "total = 0 + add", "must": ["total"], "need_all": ["total", ["add", "total + number", "total to total +", "add number to total"]], "ok": "Total initialised and updated inside the loop.", "fix": "Set total to 0 before the loop, then 'add number to total' inside it."}, {"label": "END FOR + display", "must": ["end for", "endfor"], "need_all": [["end for", "endfor"], "total"], "ok": "END FOR and final total display present.", "fix": "Close with 'end for', then display total AFTER the loop."}], "sqarl": [{"label": "SET total TO 0", "must": ["set total to 0"], "ok": "SET total TO 0 before the loop.", "fix": "Initialise before the loop: SET total TO 0"}, {"label": "FOR counter FROM 1 TO 5", "must": ["for counter from 1 to 5"], "ok": "FOR counter FROM 1 TO 5 DO is correct.", "fix": "Use: FOR counter FROM 1 TO 5 DO"}, {"label": "SET total TO total + number + END FOR", "must": ["set total to total + number", "set total to total+number"], "need_all": ["set total to total", "end for"], "ok": "Running total updated and END FOR present.", "fix": "Inside the loop: SET total TO total + number, then close with END FOR."}], "python": [{"label": "total = 0", "must": ["total = 0", "total=0"], "ok": "total = 0 set before the loop.", "fix": "Set total = 0 before the for loop."}, {"label": "for counter in range(5):", "must": ["for counter in range(5)"], "ok": "for counter in range(5): is correct.", "fix": "Use: for counter in range(5):"}, {"label": "total = total + number", "must": ["total = total + number", "total += number", "total=total+number", "total+=number"], "ok": "Running total updated correctly.", "fix": "Inside the loop: total = total + number"}]}}, {"id": 7, "title": "Count the passes", "difficulty": "Core", "construct": "Array + fixed loop + counter", "scenario": "A class of 5 pupils got the following test scores: 72, 45, 88, 51, 63. Write a program that counts how many pupils passed (scored 50 or more) and displays the total.", "python": "scores = [72, 45, 88, 51, 63]\npasses = 0\nfor counter in range(5):\n    if scores[counter] >= 50:\n        passes = passes + 1\nprint(\"Number of passes:\", passes)", "pseudo": "create an array called scores with the values: 72, 45, 88, 51, 63\nset passes to 0\nfor counter from 0 to 4\n    if scores[counter] is greater than or equal to 50\n        add 1 to passes\n    end if\nend for\ndisplay \"Number of passes:\", passes", "sqarl": "SET scores TO [72, 45, 88, 51, 63]\nSET passes TO 0\nFOR counter FROM 0 TO 4 DO\n    IF scores[counter] >= 50 THEN\n        SET passes TO passes + 1\n    END IF\nEND FOR\nSEND \"Number of passes: \" & passes TO DISPLAY", "validation": {"pseudo": [{"label": "FOR + nested IF", "must": ["for counter", "for each"], "need_all": [["for counter", "for each"], ["if scores", "if the score", "if score"]], "ok": "FOR loop with nested IF correctly used.", "fix": "Use a FOR loop with an IF inside to check each score."}, {"label": "passes + threshold", "must": ["passes"], "need_all": ["passes", "50"], "ok": "passes counter and 50 threshold both present.", "fix": "Set passes to 0 before the loop, then inside: if score >= 50, add 1 to passes."}, {"label": "END IF + END FOR", "m function norm(raw) {
  return raw.toLowerCase()
    .replace(/end\s+if\b/g,'end if').replace(/end\s+for\b/g,'end for')
    .replace(/end\s+while\b/g,'end while').replace(/else\s+if\b/g,'else if')
    .replace(/\u2260|<>/g,'!=').replace(/\u2265/g,'>=').replace(/\u2264/g,'<=')
    .replace(/\s+/g,' ').trim();
}

function has(t, phrase) {
  return t.includes(phrase.toLowerCase());
}

function checkCrit(answer, cr) {
  const t = norm(answer);

  // need_all: every item in the list must be present (items can be arrays = OR)
  if (cr.need_all) {
    for (const item of cr.need_all) {
      if (Array.isArray(item)) {
        if (!item.some(p => has(t, p))) return {label:cr.label, passed:false, msg:cr.fix, ok:cr.ok};
      } else {
        if (!has(t, item)) return {label:cr.label, passed:false, msg:cr.fix, ok:cr.ok};
      }
    }
    return {label:cr.label, passed:true, msg:cr.ok, ok:cr.ok};
  }

  // must: ANY phrase in list matches = pass
  if (cr.must) {
    const passed = cr.must.some(p => has(t, p));
    return {label:cr.label, passed, msg: passed ? cr.ok : cr.fix, ok:cr.ok};
  }

  return {label:cr.label, passed:true, msg:cr.ok, ok:cr.ok};
}

function validate(answer, criteria) {
  return criteria.map(cr => checkCrit(answer, cr));
}

function verdict(results) {
  const p = results.filter(r=>r.passed).length;
  if (p === results.length) return 'strong';
  if (p >= results.length - 1) return 'mostly';
  return 'developing';
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

          <button class="tab" onclick="st('sqarl')" style="border-radius:0 6px 0 0;background:${mtab==="sqarl"?"#1E1B18":"rgba(255,255,255,.5)"};color:${mtab==="sqarl"?"#F5F0E8":"#6B6963"};border-bottom:${mtab==="sqarl"?"none":"1px solid #C8C4BC"}">SQARL</button>
        </div>
        <pre style="border-radius:${mtab==="pseudo"?"0 6px 6px 6px":"6px 0 6px 6px"}">${esc(p[mtab])}</pre>
        <p style="font-size:12px;color:#6B6963;font-family:system-ui,sans-serif;margin-top:8px">Your pseudocode should be plain English. Switch to SQARL to see the exam-standard version.</p>
      </div>`:"";
    fhtml=`<div style="background:${vd.bg};border-radius:12px;padding:18px 22px;margin-bottom:14px;border:1px solid ${vd.br}">
      <div style="font-size:15px;font-weight:600;color:${vd.hd};margin-bottom:14px;font-family:system-ui,sans-serif">${vd.lb}</div>
      ${rows}
      <div class="two">
        <div class="mc"><div class="sub">Well done</div><div style="font-size:13px;color:#1C1C1A;line-height:1.5">✓ ${esc(praise?.ok||"You’ve made a start.")}</div></div>
        <div class="mc"><div class="sub">One thing to fix</div><div style="font-size:13px;color:#1C1C1A;line-height:1.5">→ ${esc(fix?.msg||"Review and try again.")}</div></div>
      </div>
      <button class="tog" onclick="tm()">${showM?"Hide model answer ▲":"See model answer ▼"}</button>
      ${mblock}
    </div>`;
  }

  document.getElementById("app").innerHTML=`
  <div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">${dots}<span style="font-size:11px;color:#9C9990;font-family:system-ui,sans-serif;margin-left:6px">${done.size}/12 strong</span></div>
      <div style="display:flex;gap:6px">
        <button class="nav" onclick="go(${cur-1})">← Prev</button>
        <button class="nav" onclick="go(${cur+1})">Next →</button>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px">
        <span style="font-size:16px;font-weight:600">${esc(p.title)}</span>
        <span class="badge" style="background:${d.bg};color:${d.tx}">${p.difficulty}</span>
        <span style="font-size:11px;color:#9C9990;font-family:system-ui,sans-serif;margin-left:auto">Construct: <strong style="color:#6B6963">${esc(p.construct)}</strong></span>
      </div>
      <div class="sub">Python (translate this into pseudocode)</div>${stim}
      <button class="hint" onclick="th()">${showH?"Hide scenario ▲":"Show scenario ▼"}</button>
      ${showH?hint:""}
    </div>
    <div class="card">
      <div class="sub">Your pseudocode</div>
      <textarea id="code" placeholder="Translate the Python into plain English pseudocode. Use 'counter' as your loop variable."></textarea>
      <div style="text-align:right;margin-top:10px">
        <button class="chk" onclick="chk()" style="background:#D97706">Check my answer →</button>
      </div>
    </div>
    ${fhtml}
  </div>`;

  const ta=document.getElementById("code");
  if(ta){ta.value=saved;ta.addEventListener("input",e=>saved=e.target.value);}
}

function go(i){cur=(i+12)%12;fb=null;showH=false;showM=false;mtab="pseudo";saved="";render();}
function th(){saved=document.getElementById("code")?.value||saved;showH=!showH;render();}
function tm(){showM=!showM;render();}
function st(t){mtab=t;render();}

function chk(){
  const ans=(document.getElementById("code")?.value||saved||"").trim();
  if(!ans) return;
  saved=ans;
  const p=QS[cur];
  const crit=p.validation["pseudo"]||[];
  const rs=validate(ans,crit);
  const ov=verdict(rs);
  fb={rs,ov};
  if(ov==="strong") done.add(p.id);
  showM=false;
  render();
}

render();
</script>
</body>
</html>
