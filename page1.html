function norm(raw){
  return raw.toLowerCase()
    .replace(/end\s+if\b/g,'end if').replace(/end\s+for\b/g,'end for')
    .replace(/end\s+while\b/g,'end while').replace(/else\s+if\b/g,'else if')
    .replace(/\u2260|<>/g,'!=').replace(/\u2265/g,'>=').replace(/\u2264/g,'<=')
    .replace(/\s+/g,' ').trim();
}
function has(t,p){return t.includes(p.toLowerCase());}
function checkCrit(answer,cr){
  const t=norm(answer);
  if(cr.need_all){
    for(const item of cr.need_all){
      if(Array.isArray(item)){if(!item.some(p=>has(t,p)))return{label:cr.label,passed:false,msg:cr.fix,ok:cr.ok};}
      else{if(!has(t,item))return{label:cr.label,passed:false,msg:cr.fix,ok:cr.ok};}
    }
    return{label:cr.label,passed:true,msg:cr.ok,ok:cr.ok};
  }
  if(cr.must){
    const passed=cr.must.some(p=>has(t,p));
    return{label:cr.label,passed,msg:passed?cr.ok:cr.fix,ok:cr.ok};
  }
  return{label:cr.label,passed:true,msg:cr.ok,ok:cr.ok};
}
function validate(answer,criteria){return criteria.map(cr=>checkCrit(answer,cr));}
function verdict(rs){
  const p=rs.filter(r=>r.passed).length;
  if(p===rs.length)return'strong';
  if(p>=rs.length-1)return'mostly';
  return'developing';
}

        <span style="color:${r.passed?"#059669":"#DC2626"};min-width:16px;font-size:15px;flex-shrink:0">${r.passed?"✓":"✗"}</span>
        <div style="font-size:14px;color:#3D3D3A;line-height:1.55;flex:1">
          <strong style="font-family:system-ui,sans-serif;font-size:13px">${esc(r.label)}:</strong>
          ${r.passed?` ${esc(r.msg)}`:` ${esc(r.msg.split("\n")[0])}`}
          ${!r.passed&&r.msg.includes("\n")?`<div class="fix-hint"><pre>${esc(r.msg)}</pre></div>`:""}
        </div>
      </div>`).join("");
    const praise=fb.rs.find(r=>r.passed);
    const fix=fb.rs.find(r=>!r.passed);
    const mblock=showM?`
      <div style="margin-top:12px">
        <div style="display:flex">
          <button class="tabt" onclick="st('${c.m1f}')" style="border-radius:6px 0 0 0;background:${mtab===c.m1f?"#1E1B18":"rgba(255,255,255,.5)"};color:${mtab===c.m1f?"#F5F0E8":"#6B6963"};border-bottom:${mtab===c.m1f?"none":"1px solid #C8C4BC"}">${c.m1l}</button>
          <button class="tabt" onclick="st('${c.m2f}')" style="border-radius:0 6px 0 0;background:${mtab===c.m2f?"#1E1B18":"rgba(255,255,255,.5)"};color:${mtab===c.m2f?"#F5F0E8":"#6B6963"};border-bottom:${mtab===c.m2f?"none":"1px solid #C8C4BC"}">${c.m2l}</button>
        </div>
        <pre style="border-radius:${mtab===c.m1f?"0 6px 6px 6px":"6px 0 6px 6px"}">${esc(p[mtab])}</pre>
        <p style="font-size:12px;color:#6B6963;font-family:system-ui,sans-serif;margin-top:8px">${c.note}</p>
      </div>`:"";
    fhtml=`<div style="background:${vd.bg};border-radius:12px;padding:18px 22px;margin-bottom:14px;border:1px solid ${vd.br}">
      <div style="font-size:15px;font-weight:600;color:${vd.hd};margin-bottom:14px;font-family:system-ui,sans-serif">${vd.lb}</div>
      ${rows}
      <div class="two">
        <div class="mc"><div class="sub">Well done</div><div style="font-size:13px;color:#1C1C1A;line-height:1.5">✓ ${esc(praise?.ok||"You’ve made a start.")}</div></div>
        <div class="mc"><div class="sub">One thing to fix</div><div style="font-size:13px;color:#1C1C1A;line-height:1.5">→ ${esc((fix?.msg||"Review and try again.").split("\n")[0])}</div></div>
      </div>
      <button class="tog" onclick="tm()">${showM?"Hide model answer ▲":"See model answer ▼"}</button>
      ${mblock}
    </div>`;
  }
  document.getElementById("app").innerHTML=`
  <div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">${dots}<span style="font-size:11px;color:#9C9990;font-family:system-ui,sans-serif;margin-left:6px">${c.done.size}/6 strong</span></div>
      <div style="display:flex;gap:6px"><button class="nav" onclick="go(${cur-1})">← Prev</button><button class="nav" onclick="go(${cur+1})">Next →</button></div>
    </div>
    <div class="card">
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px">
        <span style="font-size:16px;font-weight:600">${esc(p.title)}</span>
        <span class="badge" style="background:${d.bg};color:${d.tx}">${p.difficulty}</span>
        <span style="font-size:11px;color:#9C9990;font-family:system-ui,sans-serif;margin-left:auto">Construct: <strong style="color:#6B6963">${esc(p.construct)}</strong></span>
      </div>
      <div class="sub">${c.stimHead}</div>${stim}
      <button class="hint" onclick="th()">${showH?hideH+" ▲":c.hintLabel+" ▼"}</button>
      ${showH?hint:""}
    </div>
    <div class="card">
      <div class="sub">${c.ansHead}</div>
      <textarea id="code" placeholder="${c.ansPh}"></textarea>
      <div style="text-align:right;margin-top:10px"><button class="chk" onclick="chk()" style="background:#D97706">Check my answer →</button></div>
    </div>
    ${fhtml}
  </div>`;
  const ta=document.getElementById("code");
  if(ta){ta.value=saved;ta.addEventListener("input",e=>saved=e.target.value);}
}
function go(i){cur=(i+6)%6;fb=null;showH=false;showM=false;saved='';mtab=CFG[mode].m1f;render();}
function th(){saved=document.getElementById("code")?.value||saved;showH=!showH;render();}
function tm(){showM=!showM;render();}
function st(t){mtab=t;render();}
function chk(){
  const ans=(document.getElementById("code")?.value||saved||"").trim();
  if(!ans)return;
  saved=ans;
  const c=CFG[mode];const p=c.qs[cur];
  const rs=validate(ans,p.validation[c.val]||[]);
  const ov=verdict(rs);
  fb={rs,ov};
  if(ov==="strong")c.done.add(p.id);
  showM=false;render();
}
switchMode('A');
</script>
</body>
</html>
